# Important Notes:
# A field used as ${...} in fabric.mod.json, *.mixins.json or pack.mcmeta must also be added to the expandProps map
# in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=0.1.0
group=io.github.livingdeaddolls
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Spawner Waypoints
mod_author=Yuhrp
mod_id=spawnerwaypoints
license=MIT
credits=
description=Shows dungeon and structure spawners as waypoints, calculated from the world seed.
# Game versions the jar loads on (fabric.mod.json)
fabric_minecraft_dependency=~26.1
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.155.3+26.1.2
fabric_loader_version=0.19.5

# Dependencies
# YetAnotherConfigLib: https://modrinth.com/mod/yacl (artifact is <yacl_version>-fabric)
yacl_version=3.9.7+26.1
# Mod Menu (Fabric only, optional): https://modrinth.com/mod/modmenu
modmenu_version=18.0.2
# Seed Engine API and Waypoints API: published to the local Maven repository (./gradlew publishToMavenLocal in each)
seedengine_version=0.1.0+26.1.2
waypointsapi_version=0.1.0+26.1.2

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=true
